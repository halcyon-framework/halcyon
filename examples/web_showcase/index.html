<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon — Web Showcase</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e8e8e8; }
canvas { display: block; width: 100vw !important; height: 100vh !important; }
#boot-error { box-sizing: border-box; position: fixed; top: 0; left: 0; z-index: 1; width: 100%; max-height: 100vh; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; color: #900; background: white; }
</style>
<body>
<pre id="boot-error" hidden></pre>
<script type="module">
const failure = error => {
    const output = document.getElementById('boot-error');
    if (!output.textContent) output.textContent = String(error?.stack ?? error);
    output.hidden = false;
    console.error(error);
};
addEventListener('unhandledrejection', event => failure(event.reason));
addEventListener('error', event => failure(event.error ?? event.message));
// Host geometry only: no widget state, event handling or render scheduling.
const canvasAdded = new MutationObserver(() => {
    const canvas = document.querySelector('canvas');
    if (!canvas) return;
    canvasAdded.disconnect();
    const describeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        const configuration = canvas.getContext('webgpu')?.getConfiguration?.();
        const formats = configuration ? ` | canvas ${configuration.format} | views ${(configuration.viewFormats ?? []).join(',')}` : '';
        document.title = `Halcyon — Web Showcase | DPR ${devicePixelRatio} | CSS ${rect.width}×${rect.height} | backing ${canvas.width}×${canvas.height} | viewport ${innerWidth}×${innerHeight}${formats}`;
    };
    new ResizeObserver(describeCanvas).observe(canvas);
    new MutationObserver(describeCanvas).observe(canvas, {
        attributes: true, attributeFilter: ['width', 'height'],
    });
});
canvasAdded.observe(document.body, { childList: true });
try {
    if (!navigator.gpu) {
        canvasAdded.disconnect();
        failure('WebGPU is unavailable in this browser. Use a browser with WebGPU enabled.');
    } else {
        const { default: init } = await import('./halcyon_showcase.js');
        await init();
    }
} catch (error) {
    failure(error);
}
</script>
</body>
</html>
